<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Libre Piano : piano miniature stylisé dans un badge arrondi -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f6e"/>
      <stop offset="1" stop-color="#171a3e"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6f0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4f9cff"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- Corps du piano -->
  <rect x="96" y="176" width="320" height="200" rx="20" fill="#0e1029"/>
  <rect x="96" y="176" width="320" height="200" rx="20" fill="none" stroke="url(#accent)" stroke-width="6"/>

  <!-- Touches blanches -->
  <g fill="url(#key)">
    <rect x="116" y="196" width="40" height="160" rx="4"/>
    <rect x="162" y="196" width="40" height="160" rx="4"/>
    <rect x="208" y="196" width="40" height="160" rx="4"/>
    <rect x="254" y="196" width="40" height="160" rx="4"/>
    <rect x="300" y="196" width="40" height="160" rx="4"/>
    <rect x="346" y="196" width="40" height="160" rx="4"/>
  </g>

  <!-- Liseré violet sous les touches (accent signature) -->
  <rect x="116" y="348" width="270" height="8" rx="4" fill="url(#accent)" opacity="0.85"/>

  <!-- Touches noires -->
  <g fill="#14162e">
    <rect x="152" y="196" width="24" height="100" rx="3"/>
    <rect x="198" y="196" width="24" height="100" rx="3"/>
    <rect x="290" y="196" width="24" height="100" rx="3"/>
    <rect x="336" y="196" width="24" height="100" rx="3"/>
  </g>

  <!-- Note de musique flottante -->
  <g transform="translate(368, 96) rotate(12)">
    <ellipse cx="0" cy="84" rx="26" ry="18" fill="url(#accent)"/>
    <rect x="20" y="0" width="10" height="86" rx="5" fill="url(#accent)"/>
    <path d="M 24 0 q 42 10 44 44 q -18 -22 -44 -18 z" fill="url(#accent)"/>
  </g>

  <!-- Reflet haut du badge -->
  <path d="M 136 32 h 240 a 104 104 0 0 1 104 104 v 8 h -448 v -8 a 104 104 0 0 1 104 -104 z" fill="#ffffff" opacity="0.06"/>
</svg>
